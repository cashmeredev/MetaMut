name: probe

# Inspect the upstream docker image and report what it contains.
on:
  push:
    branches: [clang-fuzz]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Pull image
        run: docker pull metamut/metamut:latest

      - name: Inspect image
        run: |
          mkdir -p report
          {
            echo "## runner"
            nproc; free -g | sed -n 2p; df -h / | tail -1
            echo "## image"
            docker image inspect metamut/metamut:latest --format '{{.Size}} bytes, created {{.Created}}'
          } > report/runner.txt 2>&1
          docker run --rm metamut/metamut:latest bash -c '
            echo "## /root/MetaMut"; ls -la /root/MetaMut
            echo "## objects"; ls /root/MetaMut/objects 2>&1; du -sh /root/MetaMut/objects/* 2>&1
            echo "## configs"; cat /root/MetaMut/fuzzer/configs.py
            echo "## compilers"; cat /root/MetaMut/fuzzer/lib/Compilers.py
            echo "## versions"
            for bin in /root/MetaMut/objects/*/bin/clang /root/MetaMut/objects/*/install/bin/gcc; do
              echo "$bin"; "$bin" --version 2>&1 | head -2
            done
            echo "## mutators"; ls -la /usr/bin/muss /usr/bin/mu.s /usr/bin/mu.u 2>&1
            muss --list-mutators | tr "," "\n" | wc -l
            echo "## seeds"; ls /root/MetaMut/seeds | wc -l
            echo "## toolchain"; llvm-config --version 2>&1; python3 --version; cat /etc/os-release | head -2
            echo "## git"; cd /root/MetaMut && git log -1 --format="%H %ad %s" 2>&1
          ' > report/image.txt 2>&1 || true

      - name: Smoke fuzz for ten minutes
        run: |
          docker run --rm --ulimit stack=-1 --ulimit core=0 -v "$PWD/report:/report" metamut/metamut:latest bash -c '
            cd /root/MetaMut && mkdir -p workspace && cd workspace
            timeout 900 python3 ../fuzzer/run.py -j 4 --repeat-times 1 --duration 600 \
              --seeds-dir /root/MetaMut/seeds --cc-opt=-O2 --wdir $(pwd) > /report/fuzz.log 2>&1
            echo "exit=$?" >> /report/fuzz.log
            ls -la > /report/workspace.txt 2>&1
            python3 ../fuzzer/show.py * --summary > /report/summary.txt 2>&1
            du -sh . >> /report/workspace.txt
            find . -maxdepth 2 | head -200 >> /report/workspace.txt
          ' || true
          sudo chown -R "$USER" report
          tail -c 20000 report/fuzz.log > report/fuzz-tail.log; rm report/fuzz.log

      - name: Check out repository for publishing
        uses: actions/checkout@v4
        with:
          path: out
          fetch-depth: 1

      - name: Publish report
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin ci-results; then
            git checkout -q -B ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results && git rm -rqf .
          fi
          mkdir -p "probe/${GITHUB_RUN_ID}" && cp -r ../report/. "probe/${GITHUB_RUN_ID}/"
          git add -A probe && git commit -q -m "probe: report for run ${GITHUB_RUN_ID}"
          git push -q origin ci-results
