name: cases

# Compile the hand-written programs in ci/cases with the current clang build
# and publish how the compiler reacts to each of them.
on:
  push:
    branches: [clang-fuzz]
    paths: [ci/cases/**]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  LLVM_SYMBOLIZER_PATH: /usr/lib/llvm-18/bin/llvm-symbolizer

jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Load the clang build
        id: params
        run: |
          git fetch -q --depth 1 origin ci-results
          git show FETCH_HEAD:clang/latest.env > latest.env
          cat latest.env
          echo "clang_run_id=$(grep '^CLANG_RUN_ID=' latest.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18 zstd

      - uses: actions/download-artifact@v4
        with:
          name: clang-plain
          run-id: ${{ steps.params.outputs.clang_run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Compile the cases
        run: |
          mkdir -p clang
          tar -I zstd -xf artifacts/clang-plain.tar.zst -C clang
          bash ci/run-cases.sh clang/bin/clang ci/cases out
          cp latest.env out/clang.env

      - name: Check out repository for publishing
        uses: actions/checkout@v4
        with:
          path: publish
          fetch-depth: 1

      - name: Publish the results
        run: |
          bash ci/publish.sh publish out "cases/${{ github.run_id }}" \
            "cases: results of run ${{ github.run_id }}"
